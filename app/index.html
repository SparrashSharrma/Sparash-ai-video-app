<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio Pro Max</title>
  <style>
    :root {
      --primary: #6366f1;
      --accent: #ec4899;
      --bg: #0b0f19;
      --card: #151c2c;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #242f48;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 20px;
      margin: 0;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .developer-badge {
      font-size: 11px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      font-weight: 600;
    }
    .tabs {
      display: flex;
      background: var(--card);
      padding: 4px;
      border-radius: 12px;
      gap: 6px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .section { display: none; }
    .section.active { display: block; }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #4f46e5); }
    .btn-news { background: linear-gradient(135deg, var(--danger), #b91c1c); }
    .btn-download { background: #10b981; margin-top: 10px; display: none; }

    /* Canvas Screen Preview */
    .viewport-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 16px;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      background: #000;
      max-width: 100%;
      border: 2px solid var(--border);
    }
    #statusBadge {
      text-align: center;
      font-size: 13px;
      color: #38bdf8;
      margin-top: 10px;
      font-weight: 500;
    }
    footer {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 16px 0 6px;
    }
    footer span { color: #f59e0b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h1>AI Studio Pro Max</h1>
    <div class="developer-badge">तृप्त एंटरप्राइज़: स्पर्श शर्मा</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('reel')">⚡ 1-Click Reel Maker</button>
    <button class="tab" onclick="setTab('news')">🎙️ AI News Studio</button>
  </div>

  <!-- TAB 1: 1-CLICK REEL MAKER -->
  <div id="reelSection" class="section active">
    <div class="card">
      <label>1. Multiple Photos / Videos Upload Karein:</label>
      <input type="file" id="reelMedia" accept="image/*,video/*" multiple onchange="onReelFilesSelected(event)" />

      <label>2. Beat & Motion Template Style:</label>
      <select id="reelStyle">
        <option value="pulse">🔥 Fast Beat Drop Pulse (Trap BGM)</option>
        <option value="zoom">🎬 Cinematic Infinite Zoom (Moody Vibe)</option>
        <option value="shake">⚡ Extreme Swagger Action (Bass Boost)</option>
      </select>

      <label>3. Background Music Sound Beat:</label>
      <select id="reelMusic">
        <option value="electro">🎵 Trending Energetic Phonk Beat</option>
        <option value="cyber">🎵 Cyberpunk Hyper Drum Beat</option>
      </select>

      <button class="btn btn-primary" onclick="renderReel()">🚀 Generate Reel Video</button>
    </div>
  </div>

  <!-- TAB 2: AI NEWS STUDIO -->
  <div id="newsSection" class="section">
    <div class="card">
      <label>1. Breaking News Headline:</label>
      <input type="text" id="newsHead" placeholder="Taaza Bada Hadsa / Khabar..." />

      <label>2. Press Note (Hindi News Script):</label>
      <textarea id="newsText" rows="3" placeholder="Pura press note yahan paste karein. AI Anchor ise bolkar sunayega..."></textarea>

      <label>3. Upload Custom AI Anchor Photo:</label>
      <input type="file" id="anchorImgInput" accept="image/*" onchange="onAnchorUploaded(event)" />

      <label>4. Upload Ground Footage / Incident Photos (Multiple):</label>
      <input type="file" id="newsMedia" accept="image/*,video/*" multiple onchange="onNewsFilesSelected(event)" />

      <button class="btn btn-news" onclick="renderNews()">📢 Broadcast & Create News</button>
    </div>
  </div>

  <!-- COMMON VIEWPORT & DOWNLOAD -->
  <div class="viewport-container">
    <canvas id="studioCanvas" width="720" height="1280" style="display:none; width: 270px; height: 480px;"></canvas>
    <div id="statusBadge"></div>
    <button id="dlBtn" class="btn btn-download" onclick="downloadVideo()">💾 Download Video To Gallery</button>
  </div>

  <footer>
    डेवलपर: <span>तृप्त एंटरप्राइज़: स्पर्श शर्मा</span>
  </footer>

  <script>
    const canvas = document.getElementById('studioCanvas');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');
    const dlBtn = document.getElementById('dlBtn');

    let currentTab = 'reel';
    let loadedReelImages = [];
    let loadedNewsMedia = [];
    let customAnchorImg = null;
    let animTimer = null;
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;

    // Default Anchor
    const defaultAnchor = new Image();
    defaultAnchor.crossOrigin = "anonymous";
    defaultAnchor.src = "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80";

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (tab === 'reel' && i === 0) || (tab === 'news' && i === 1)));
      document.getElementById('reelSection').classList.toggle('active', tab === 'reel');
      document.getElementById('newsSection').classList.toggle('active', tab === 'news');
      resetPlayback();
    }

    function resetPlayback() {
      if (animTimer) cancelAnimationFrame(animTimer);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      canvas.style.display = 'none';
      dlBtn.style.display = 'none';
      statusBadge.innerText = '';
    }

    function onAnchorUploaded(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        customAnchorImg = new Image();
        customAnchorImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function onReelFilesSelected(e) {
      loadedReelImages = [];
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.src = evt.target.result;
          loadedReelImages.push(img);
        };
        reader.readAsDataURL(file);
      });
    }

    function onNewsFilesSelected(e) {
      loadedNewsMedia = [];
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.src = evt.target.result;
          loadedNewsMedia.push(img);
        };
        reader.readAsDataURL(file);
      });
    }

    // Audio Engine: Beat Synthesizer for Reels
    function playBeatSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch (e) {}
    }

    // Recording Engine for Gallery Download
    function startRecording() {
      recordedChunks = [];
      const stream = canvas.captureStream(30);
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        recordedBlob = new Blob(recordedChunks, { type: 'video/mp4' });
        dlBtn.style.display = 'block';
        statusBadge.innerText = '✅ Video Ready! Neeche "Download" button dabayein.';
      };
      mediaRecorder.start();
    }

    // RENDER: 1-CLICK REEL
    function renderReel() {
      if (loadedReelImages.length === 0) {
        alert("Kripya pehle 1 ya zyada photos/videos select karein!");
        return;
      }
      resetPlayback();
      canvas.width = 720;
      canvas.height = 1280;
      canvas.style.display = 'block';
      statusBadge.innerText = 'Reel Generate aur Record ho rahi hai...';

      startRecording();
      let frame = 0;
      let currentIndex = 0;
      const totalFrames = 250; // Approx 8-9 seconds reel
      const style = document.getElementById('reelStyle').value;

      function drawReelFrame() {
        frame++;
        if (frame % 28 === 0) {
          currentIndex = (currentIndex + 1) % loadedReelImages.length;
          playBeatSound();
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const img = loadedReelImages[currentIndex];
        if (img && img.complete) {
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);

          let scale = 1.0;
          if (style === 'pulse') scale = 1.0 + Math.sin(frame * 0.35) * 0.08;
          else if (style === 'zoom') scale = 1.0 + (frame % 28) * 0.005;
          else if (style === 'shake') {
            scale = 1.05;
            ctx.rotate((Math.random() - 0.5) * 0.02);
          }

          ctx.scale(scale, scale);
          const ratio = Math.max(canvas.width / img.width, canvas.height / img.height);
          const nw = img.width * ratio;
          const nh = img.height * ratio;
          ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
          ctx.restore();
        }

        // Overlay & Branding
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, 0, canvas.width, 100);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('AI STUDIO PRO • REEL', 30, 60);

        ctx.fillStyle = '#fbbf24';
        ctx.font = '22px sans-serif';
        ctx.fillText('तृप्त एंटरप्राइज़: स्पर्श शर्मा', 30, 90);

        if (frame < totalFrames) {
          animTimer = requestAnimationFrame(drawReelFrame);
        } else {
          mediaRecorder.stop();
        }
      }
      drawReelFrame();
    }

    // RENDER: AI NEWS BULLETIN
    function renderNews() {
      const script = document.getElementById('newsText').value.trim();
      const headline = document.getElementById('newsHead').value.trim() || "TAAZA TAREEN KHABAR";
      if (!script) {
        alert("Kripya Press note script likhein!");
        return;
      }
      resetPlayback();
      canvas.width = 1280;
      canvas.height = 720;
      canvas.style.display = 'block';
      statusBadge.innerText = 'AI News Anchor Bulletin padh raha hai...';

      startRecording();
      let frame = 0;
      let isSpeaking = false;
      let tickerX = canvas.width;

      // Start Natural Speech
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(script);
        utter.lang = 'hi-IN';
        utter.rate = 0.95;
        utter.onstart = () => { isSpeaking = true; };
        utter.onend = () => {
          isSpeaking = false;
          setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 1000);
        };
        window.speechSynthesis.speak(utter);
      } else {
        isSpeaking = true;
        setTimeout(() => { isSpeaking = false; mediaRecorder.stop(); }, 7000);
      }

      function drawNewsFrame() {
        frame++;
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Incident B-Roll Media
        if (loadedNewsMedia.length > 0) {
          const mImg = loadedNewsMedia[Math.floor(frame / 60) % loadedNewsMedia.length];
          if (mImg && mImg.complete) {
            ctx.drawImage(mImg, 0, 0, canvas.width, canvas.height);
          }
        }

        // Dark gradient overlay for news clarity
        const grad = ctx.createLinearGradient(0, canvas.height - 200, 0, canvas.height);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. PiP Anchor with Lip-Sync Movement
        const anchor = customAnchorImg || defaultAnchor;
        const ax = canvas.width - 240, ay = canvas.height - 300, aw = 200, ah = 200;

        ctx.save();
        ctx.beginPath();
        ctx.arc(ax + aw / 2, ay + ah / 2, aw / 2, 0, Math.PI * 2);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.clip();
        ctx.drawImage(anchor, ax, ay, aw, ah);

        // Real-Time Lip-Sync Overlay
        if (isSpeaking) {
          const mouthOpen = Math.abs(Math.sin(frame * 0.45)) * 14;
          ctx.fillStyle = '#4a0e17';
          ctx.beginPath();
          ctx.ellipse(ax + aw / 2, ay + ah * 0.68, 14, mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Anchor Name Plate
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(ax - 10, ay + ah - 15, aw + 20, 26);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('AI NEWS ANCHOR', ax + aw / 2, ay + ah + 4);
        ctx.textAlign = 'left';

        // 3. Breaking News Ticker Bar
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(0, canvas.height - 70, canvas.width, 70);

        ctx.fillStyle = '#fef08a';
        ctx.fillRect(0, canvas.height - 70, 160, 70);
        ctx.fillStyle = '#b91c1c';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('BREAKING', 14, canvas.height - 26);

        // Scrolling Ticker Text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(headline + "  |  " + script, tickerX, canvas.height - 26);
        tickerX -= 4;
        if (tickerX < -1500) tickerX = canvas.width;

        // Branding
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, 50);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('AI NEWS STUDIO', 20, 32);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '16px sans-serif';
        ctx.fillText('तृप्त एंटरप्राइज़: स्पर्श शर्मा', canvas.width - 240, 32);

        if (mediaRecorder && mediaRecorder.state === 'recording') {
          animTimer = requestAnimationFrame(drawNewsFrame);
        }
      }
      drawNewsFrame();
    }

    // DOWNLOAD TO GALLERY FUNCTION
    function downloadVideo() {
      if (!recordedBlob) return;
      const url = URL.createObjectURL(recordedBlob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `AI_Studio_${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }
  </script>
</body>
</html>
