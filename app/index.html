<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Studio Pro Max - Tript Enterprises</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --surface: #101524;
      --surface-card: #161d31;
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent: #06b6d4;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #232d48;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      margin: 0;
      padding: 16px 14px 28px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dev-badge {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .tabs-wrapper {
      display: flex;
      background: var(--surface);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.45);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .studio-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .input-group { margin-bottom: 14px; }

    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      display: block;
    }

    .input-box, select, textarea {
      width: 100%;
      background: #0b0e17;
      border: 1.5px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .file-dropzone {
      border: 2px dashed var(--border);
      background: rgba(11, 14, 23, 0.6);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .file-dropzone input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-dropzone-text {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    .file-dropzone-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--primary-gradient);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .news-broadcast-btn {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }

    /* Player Viewport */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 6px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .video-viewport {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9/16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    .video-viewport.ratio-16-9 {
      max-width: 100%;
      aspect-ratio: 16/9;
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #studioCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #1a2236;
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--primary-gradient);
      transition: width 0.1s linear;
    }

    .status-caption {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      margin-top: 10px;
      text-align: center;
    }

    .download-btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      border: none;
      background: var(--success);
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
    }

    footer {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      padding-top: 20px;
    }

    footer span { color: #fbbf24; font-weight: 700; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand-title">AI STUDIO PRO</div>
    <div class="dev-badge">तृप्त एंटरप्राइज़: स्पर्श शर्मा</div>
  </header>

  <div class="tabs-wrapper">
    <button class="tab-btn active" onclick="switchStudioTab('reel')">✨ 1-Click Reel Pro</button>
    <button class="tab-btn" onclick="switchStudioTab('news')">🎙️ AI News Bulletin</button>
  </div>

  <!-- TAB 1: 1-CLICK REEL MAKER -->
  <div id="reelTab" class="tab-content active">
    <div class="studio-card">
      <div class="input-group">
        <label class="input-label">1. Upload Photos / Videos (Multiple)</label>
        <div class="file-dropzone">
          <input type="file" id="reelMediaInput" accept="image/*,video/*" multiple onchange="onReelFilesPicked(event)">
          <div class="file-dropzone-text" id="reelFileLabel">📁 Gallery se photos/videos chunein</div>
          <div class="file-dropzone-sub">Auto Beat-Sync ke liye 3 se 10 photos chunein</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">2. Template Style</label>
        <select id="reelTemplateSelect">
          <option value="trap_beat">🔥 Ultra Beat Drop Pulse (Trap / Bass Boost)</option>
          <option value="cinematic_glide">🎬 Cinematic Slow Drift (Moody Ambient)</option>
          <option value="cyber_glitch">⚡ Cyberpunk Fast RGB Glitch (EDM)</option>
          <option value="swagger_zoom">🕶️ Attitude Stunt Zoom & Rotate</option>
          <option value="aesthetic_fade">✨ Aesthetic Soft Glow & Crossfade</option>
          <option value="hyper_shake">💥 Hyper Kinetic Shake (Trending Reel)</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">3. Reel Duration (20s - 60s)</label>
        <select id="reelDurationSelect">
          <option value="20">⏱️ 20 Seconds (Fast Reel)</option>
          <option value="30" selected>⏱️ 30 Seconds (Instagram Standard)</option>
          <option value="45">⏱️ 45 Seconds (Extended Story)</option>
          <option value="60">⏱️ 60 Seconds (Full 1-Minute Showcase)</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">4. BGM Sound Track</label>
        <select id="reelSoundTrack">
          <option value="phonk">🎵 Trending High-Energy Phonk Bass</option>
          <option value="synthwave">🎵 Retro Synthwave Drive Beat</option>
          <option value="hiphop">🎵 Deep Boom-Bap Lo-Fi Beat</option>
        </select>
      </div>

      <button class="main-btn" onclick="startReelGeneration()">
        🚀 Generate Complete Reel (With Music & Playback)
      </button>
    </div>
  </div>

  <!-- TAB 2: AI NEWS STUDIO -->
  <div id="newsTab" class="tab-content">
    <div class="studio-card">
      <div class="input-group">
        <label class="input-label">1. Video Frame Format (Ratio)</label>
        <select id="newsAspectRatio">
          <option value="16:9">📺 16:9 Landscape (YouTube / TV Bulletin)</option>
          <option value="9:16">📱 9:16 Vertical (Instagram Reels / Shorts)</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">2. Breaking News Headline</label>
        <input type="text" class="input-box" id="newsHeadText" placeholder="Udaharan: Badi khabar, prashasan ne liya sakht faisla..." />
      </div>

      <div class="input-group">
        <label class="input-label">3. Press Note (Hindi News Script for Voice-over)</label>
        <textarea rows="3" id="newsFullScript" placeholder="Khabar ka pura vivaran yahan likhein ya paste karein. AI Anchor ise poori Hindi aawaz ke saath padhega..."></textarea>
      </div>

      <div class="input-group">
        <label class="input-label">4. Custom News Anchor Photo (Optional)</label>
        <div class="file-dropzone">
          <input type="file" id="anchorUploadInput" accept="image/*" onchange="onCustomAnchorPicked(event)">
          <div class="file-dropzone-text" id="anchorLabel">👤 Anchor ki photo upload karein (Optional)</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">5. Incident Footage / Ground Photos (Multiple)</label>
        <div class="file-dropzone">
          <input type="file" id="newsMediaInput" accept="image/*,video/*" multiple onchange="onNewsMediaPicked(event)">
          <div class="file-dropzone-text" id="newsMediaLabel">📹 Khabar ki photos ya video clips chunein</div>
        </div>
      </div>

      <button class="main-btn news-broadcast-btn" onclick="startNewsGeneration()">
        📢 Broadcast News (Hindi Voice-over & Lip-Sync)
      </button>
    </div>
  </div>

  <!-- PREVIEW, PLAYBACK & DOWNLOAD SECTION -->
  <div class="player-card" id="playerContainer">
    <div class="video-viewport" id="viewportFrame">
      <canvas id="studioCanvas" width="720" height="1280"></canvas>
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="progress-bar-container" id="progBar">
      <div class="progress-fill" id="progFill"></div>
    </div>

    <div class="status-caption" id="statusMessage">Tayar ho raha hai...</div>

    <button class="download-btn" id="galleryDownloadBtn" onclick="saveVideoToDevice()">
      📥 Download Video To Gallery (MP4/WebM)
    </button>
  </div>

  <footer>
    डेवलपर: <span>तृप्त एंटरप्राइज़: स्पर्श शर्मा</span>
  </footer>

  <script>
    const canvas = document.getElementById('studioCanvas');
    const ctx = canvas.getContext('2d');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerContainer = document.getElementById('playerContainer');
    const viewportFrame = document.getElementById('viewportFrame');
    const progBar = document.getElementById('progBar');
    const progFill = document.getElementById('progFill');
    const statusMessage = document.getElementById('statusMessage');
    const galleryDownloadBtn = document.getElementById('galleryDownloadBtn');

    let reelFiles = [];
    let newsFiles = [];
    let customAnchorImg = null;
    let audioContext = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let finalVideoBlob = null;
    let animRequest = null;

    const defaultAnchor = new Image();
    defaultAnchor.crossOrigin = "anonymous";
    defaultAnchor.src = "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80";

    function switchStudioTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (tab === 'reel' && i === 0) || (tab === 'news' && i === 1)));
      document.getElementById('reelTab').classList.toggle('active', tab === 'reel');
      document.getElementById('newsTab').classList.toggle('active', tab === 'news');
      stopCurrentProcess();
    }

    function stopCurrentProcess() {
      if (animRequest) cancelAnimationFrame(animRequest);
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      playerContainer.style.display = 'none';
      videoPlayer.style.display = 'none';
      videoPlayer.pause();
      canvas.style.display = 'block';
      galleryDownloadBtn.style.display = 'none';
    }

    function onReelFilesPicked(e) {
      reelFiles = [];
      const files = Array.from(e.target.files);
      if (!files.length) return;
      document.getElementById('reelFileLabel').innerText = `✅ ${files.length} Files Selected!`;
      files.forEach(file => {
        const r = new FileReader();
        r.onload = ev => {
          const img = new Image();
          img.src = ev.target.result;
          reelFiles.push(img);
        };
        r.readAsDataURL(file);
      });
    }

    function onCustomAnchorPicked(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('anchorLabel').innerText = `✅ Anchor Photo Added!`;
      const r = new FileReader();
      r.onload = ev => {
        customAnchorImg = new Image();
        customAnchorImg.src = ev.target.result;
      };
      r.readAsDataURL(file);
    }

    function onNewsMediaPicked(e) {
      newsFiles = [];
      const files = Array.from(e.target.files);
      if (!files.length) return;
      document.getElementById('newsMediaLabel').innerText = `✅ ${files.length} Ground Media Selected!`;
      files.forEach(file => {
        const r = new FileReader();
        r.onload = ev => {
          const img = new Image();
          img.src = ev.target.result;
          newsFiles.push(img);
        };
        r.readAsDataURL(file);
      });
    }

    function createSoundBeatEngine() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      const dest = audioContext.createMediaStreamDestination();
      let isPlaying = true;

      function triggerKick(time) {
        if (!isPlaying) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(32, time + 0.16);
        gain.gain.setValueAtTime(1.0, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.16);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        gain.connect(dest);
        osc.start(time);
        osc.stop(time + 0.16);
      }

      function triggerSnare(time) {
        if (!isPlaying) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, time);
        gain.gain.setValueAtTime(0.4, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        gain.connect(dest);
        osc.start(time);
        osc.stop(time + 0.12);
      }

      const interval = 60 / 128;
      let nextBeatTime = audioContext.currentTime;
      let beatCounter = 0;

      const timerId = setInterval(() => {
        if (!isPlaying) { clearInterval(timerId); return; }
        while (nextBeatTime < audioContext.currentTime + 0.2) {
          if (beatCounter % 2 === 0) triggerKick(nextBeatTime);
          else triggerSnare(nextBeatTime);
          beatCounter++;
          nextBeatTime += interval / 2;
        }
      }, 50);

      return {
        audioStreamTrack: dest.stream.getAudioTracks()[0],
        stop: () => { isPlaying = false; }
      };
    }

    // 1-CLICK REEL GENERATOR
    function startReelGeneration() {
      if (reelFiles.length === 0) {
        alert("Kripya pehle Gallery se 1 ya zyada photo/video chunein!");
        return;
      }

      stopCurrentProcess();
      playerContainer.style.display = 'flex';
      viewportFrame.className = 'video-viewport';
      canvas.width = 720;
      canvas.height = 1280;
      canvas.style.display = 'block';
      progBar.style.display = 'block';

      const durationSec = parseInt(document.getElementById('reelDurationSelect').value, 10);
      const template = document.getElementById('reelTemplateSelect').value;
      const fps = 30;
      const totalFrames = durationSec * fps;
      let currentFrame = 0;
      let mediaIdx = 0;

      const soundEngine = createSoundBeatEngine();
      const canvasStream = canvas.captureStream(fps);
      if (soundEngine.audioStreamTrack) canvasStream.addTrack(soundEngine.audioStreamTrack);

      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9,opus' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(canvasStream);
      }

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        soundEngine.stop();
        finalVideoBlob = new Blob(recordedChunks, { type: 'video/mp4' });
        const videoURL = URL.createObjectURL(finalVideoBlob);

        canvas.style.display = 'none';
        videoPlayer.style.display = 'block';
        videoPlayer.src = videoURL;
        videoPlayer.play();

        progBar.style.display = 'none';
        statusMessage.innerText = '✅ Reel Taiyar! Playback chalu hai. Gallery me save karne ke liye Download dabayein.';
        galleryDownloadBtn.style.display = 'flex';
      };

      mediaRecorder.start();
      statusMessage.innerText = `Reel render ho rahi hai (${durationSec}s)...`;

      function renderFrame() {
        currentFrame++;
        const progress = (currentFrame / totalFrames) * 100;
        progFill.style.width = progress + '%';

        if (currentFrame % 35 === 0) {
          mediaIdx = (mediaIdx + 1) % reelFiles.length;
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const img = reelFiles[mediaIdx];
        if (img && img.complete) {
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);

          let scale = 1.0;
          if (template === 'trap_beat') {
            scale = 1.0 + Math.sin(currentFrame * 0.4) * 0.08;
          } else if (template === 'cinematic_glide') {
            scale = 1.0 + (currentFrame % 120) * 0.0018;
          } else if (template === 'swagger_zoom') {
            scale = 1.04;
            ctx.rotate(Math.sin(currentFrame * 0.08) * 0.03);
          } else if (template === 'hyper_shake') {
            scale = 1.08;
            if (currentFrame % 4 === 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
          }

          ctx.scale(scale, scale);
          const ratio = Math.max(canvas.width / img.width, canvas.height / img.height);
          const nw = img.width * ratio;
          const nh = img.height * ratio;
          ctx.drawImage(img, -nw / 2, -nh / 2, nw, nh);
          ctx.restore();
        }

        const topGrad = ctx.createLinearGradient(0, 0, 0, 180);
        topGrad.addColorStop(0, 'rgba(0,0,0,0.75)');
        topGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, 180);

        ctx.fillStyle = '#fff';
        ctx.font = '800 32px Outfit, sans-serif';
        ctx.fillText('AI STUDIO PRO', 36, 70);

        ctx.fillStyle = '#fbbf24';
        ctx.font = '600 20px Plus Jakarta Sans, sans-serif';
        ctx.fillText('तृप्त एंटरप्राइज़: स्पर्श शर्मा', 36, 105);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(36, canvas.height - 70, 200, 36);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '700 16px Outfit, sans-serif';
        ctx.fillText(`• ${template.toUpperCase()}`, 50, canvas.height - 46);

        if (currentFrame < totalFrames) {
          animRequest = requestAnimationFrame(renderFrame);
        } else {
          mediaRecorder.stop();
        }
      }
      renderFrame();
    }

    // AI NEWS BULLETIN GENERATOR (16:9 & 9:16 Both Supported)
    function startNewsGeneration() {
      const script = document.getElementById('newsFullScript').value.trim();
      const head = document.getElementById('newsHeadText').value.trim() || "BREAKING NEWS BULLETIN";
      const ratio = document.getElementById('newsAspectRatio').value;

      if (!script) {
        alert("Kripya Press note script text likhein!");
        return;
      }

      stopCurrentProcess();
      playerContainer.style.display = 'flex';

      const isVertical = ratio === '9:16';
      viewportFrame.className = isVertical ? 'video-viewport' : 'video-viewport ratio-16-9';

      canvas.width = isVertical ? 720 : 1280;
      canvas.height = isVertical ? 1280 : 720;
      canvas.style.display = 'block';
      progBar.style.display = 'block';

      let isVoiceActive = false;
      let tickerScroll = canvas.width;
      let frame = 0;

      const destStream = canvas.captureStream(30);
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(destStream, { mimeType: 'video/webm' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(destStream);
      }

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        finalVideoBlob = new Blob(recordedChunks, { type: 'video/mp4' });
        const videoURL = URL.createObjectURL(finalVideoBlob);

        canvas.style.display = 'none';
        videoPlayer.style.display = 'block';
        videoPlayer.src = videoURL;
        videoPlayer.play();

        progBar.style.display = 'none';
        statusMessage.innerText = '✅ News Bulletin Ready! Video play ho rahi hai. Gallery me download karein.';
        galleryDownloadBtn.style.display = 'flex';
      };

      mediaRecorder.start();
      statusMessage.innerText = "AI News Anchor Hindi me bulletin padh raha hai...";

      // Hindi Native Speech Engine with Android Voice Fallback
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(script);
        u.lang = 'hi-IN';
        u.rate = 0.95;

        // Android Hindi Voice Selection
        const voices = window.speechSynthesis.getVoices();
        const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('hin'));
        if (hindiVoice) u.voice = hindiVoice;

        u.onstart = () => { isVoiceActive = true; };
        u.onend = () => {
          isVoiceActive = false;
          setTimeout(() => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 1200);
        };
        u.onerror = () => {
          isVoiceActive = false;
          if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        };
        window.speechSynthesis.speak(u);
      } else {
        isVoiceActive = true;
        setTimeout(() => { isVoiceActive = false; mediaRecorder.stop(); }, 12000);
      }

      function renderNewsFrame() {
        frame++;

        // 1. Incident B-Roll Background
        ctx.fillStyle = '#0a0f1d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (newsFiles.length > 0) {
          const curMedia = newsFiles[Math.floor(frame / 70) % newsFiles.length];
          if (curMedia && curMedia.complete) {
            const ratioImg = Math.max(canvas.width / curMedia.width, canvas.height / curMedia.height);
            const w = curMedia.width * ratioImg;
            const h = curMedia.height * ratioImg;
            ctx.drawImage(curMedia, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
          }
        }

        // Dark Studio Vignette
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, 'rgba(0,0,0,0.6)');
        grad.addColorStop(0.7, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.92)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Picture-in-Picture Anchor with Lip Movement
        const anchor = customAnchorImg || defaultAnchor;
        const asize = isVertical ? 220 : 210;
        const ax = isVertical ? (canvas.width - asize) / 2 : canvas.width - 250;
        const ay = isVertical ? canvas.height - 390 : canvas.height - 330;

        ctx.save();
        ctx.beginPath();
        ctx.arc(ax + asize / 2, ay + asize / 2, asize / 2, 0, Math.PI * 2);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.clip();
        ctx.drawImage(anchor, ax, ay, asize, asize);

        // Real-Time Animated Mouth Lip-Sync
        if (isVoiceActive) {
          const mouthOpen = Math.abs(Math.sin(frame * 0.45)) * 15;
          ctx.fillStyle = '#3a0c10';
          ctx.beginPath();
          ctx.ellipse(ax + asize / 2, ay + asize * 0.70, 14, mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Anchor Plate
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(ax + 10, ay + asize - 18, asize - 20, 28);
        ctx.fillStyle = '#fff';
        ctx.font = '700 15px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LIVE ANCHOR', ax + asize / 2, ay + asize + 2);
        ctx.textAlign = 'left';

        // 3. News Ticker Bottom Bar
        const tickerH = isVertical ? 90 : 75;
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(0, canvas.height - tickerH, canvas.width, tickerH);

        const badgeW = isVertical ? 150 : 180;
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(0, canvas.height - tickerH, badgeW, tickerH);
        ctx.fillStyle = '#991b1b';
        ctx.font = '800 23px Outfit, sans-serif';
        ctx.fillText('BREAKING', 18, canvas.height - (tickerH / 2) + 8);

        ctx.fillStyle = '#ffffff';
        ctx.font = '700 22px Plus Jakarta Sans, sans-serif';
        ctx.fillText(head + "  ---  " + script, tickerScroll, canvas.height - (tickerH / 2) + 8);
        tickerScroll -= 4;
        if (tickerScroll < -2200) tickerScroll = canvas.width;

        // Top Channel Header
        ctx.fillStyle = '#fff';
        ctx.font = '800 22px Outfit, sans-serif';
        ctx.fillText('AI NEWS STUDIO', 24, 44);

        ctx.fillStyle = '#fbbf24';
        ctx.font = '600 16px Plus Jakarta Sans, sans-serif';
        ctx.fillText('तृप्त एंटरप्राइज़: स्पर्श शर्मा', canvas.width - (isVertical ? 220 : 250), 44);

        if (mediaRecorder.state === 'recording') {
          animRequest = requestAnimationFrame(renderNewsFrame);
        }
      }
      renderNewsFrame();
    }

    // DOWNLOAD DIRECTLY TO ANDROID GALLERY / STORAGE
    function saveVideoToDevice() {
      if (!finalVideoBlob) {
        alert("Pehle video banayein!");
        return;
      }

      const fileName = `StudioPro_${Date.now()}.mp4`;
      const reader = new FileReader();
      reader.onload = function(e) {
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = e.target.result;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => document.body.removeChild(a), 400);
      };
      reader.readAsDataURL(finalVideoBlob);

      statusMessage.innerText = "📥 Video Download shuru ho gayi hai! Notification bar check karein.";
    }
  </script>
</body>
