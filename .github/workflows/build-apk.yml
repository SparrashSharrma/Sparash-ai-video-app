name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Prepare Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AI News Studio" "com.ainews.studio" --web-dir app
          rm -rf android
          npx cap add android
          npx cap copy android
          mkdir -p android/app/src/main/assets/public
          cp -r app/* android/app/src/main/assets/public/

      - name: Fix Duplicate Kotlin Classes
        run: |
          cat << 'KOTLIN_FIX' >> android/app/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          KOTLIN_FIX

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-News-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
